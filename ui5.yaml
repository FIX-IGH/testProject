specVersion: "4.0"
metadata:
  name: "tp.example"
type: application
framework:
  name: OpenUI5
  version: "1.152.0"
  libraries:
    - name: sap.ui.core
    - name: themelib_sap_horizon
server:
  customMiddleware:
  - name: ui5-tooling-transpile-middleware
    afterMiddleware: compression
  - name: ui5-middleware-serveframework
    afterMiddleware: compression
  - name: ui5-middleware-livereload
    afterMiddleware: compression